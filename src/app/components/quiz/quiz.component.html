<div class="max-w-4xl mx-auto p-6">
  <!-- Loading State -->
  <app-loader *ngIf="isLoading"></app-loader>

  <!-- Quiz Setup -->
  <div *ngIf="!isLoading && questions.length === 0" class="space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-3xl font-bold text-purple-700 mb-2">Quiz Setup</h1>
      <p class="text-gray-600 dark:text-gray-300">
        Choose your preferences and start the quiz!
      </p>
    </div>

    <!-- Setup Form -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 space-y-6">
      <!-- API Source Selection -->
      <div class="space-y-2">
        <label
          class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >Question Source</label
        >
        <div class="flex gap-4">
          <label class="flex items-center">
            <input
              type="radio"
              [(ngModel)]="selectedApiSource"
              value="opentdb"
              class="mr-2"
            />
            <span class="text-sm">OpenTDB (Free)</span>
          </label>
          <label class="flex items-center">
            <input
              type="radio"
              [(ngModel)]="selectedApiSource"
              value="quizapi"
              class="mr-2"
            />
            <span class="text-sm">QuizAPI (Limited)</span>
          </label>
        </div>
      </div>

      <!-- Category Selection -->
      <div class="grid md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label
            for="category"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Category</label
          >
          <select
            id="category"
            [(ngModel)]="selectedCategory"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          >
            <option value="general">General Knowledge</option>
            <option value="science">Science & Nature</option>
            <option value="computers">Computers</option>
            <option value="mathematics">Mathematics</option>
            <option value="sports">Sports</option>
            <option value="geography">Geography</option>
            <option value="history">History</option>
            <option value="politics">Politics</option>
            <option value="art">Art</option>
            <option value="celebrities">Celebrities</option>
            <option value="animals">Animals</option>
            <option value="vehicles">Vehicles</option>
            <option value="comics">Comics</option>
            <option value="gadgets">Gadgets</option>
            <option value="anime">Anime & Manga</option>
            <option value="cartoons">Cartoons & Animations</option>
          </select>
        </div>

        <div class="space-y-2">
          <label
            for="difficulty"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
            >Difficulty</label
          >
          <select
            id="difficulty"
            [(ngModel)]="selectedDifficulty"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          >
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <!-- Error Message -->
      <div
        *ngIf="noQuestionsFound"
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded"
      >
        <p>
          Oops! No questions found for the selected criteria. Please try a
          different category or difficulty.
        </p>
      </div>

      <!-- Start Button -->
      <div class="text-center pt-4">
        <button
          (click)="getQuestions()"
          [disabled]="isLoading"
          class="px-8 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition-transform disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="!isLoading">Start Quiz</span>
          <span *ngIf="isLoading">Loading...</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Quiz Questions -->
  <div *ngIf="questions.length > 0 && !noQuestionsFound">
    <app-question [questions]="questions"></app-question>
  </div>
</div>
