<div class="flex flex-col items-center justify-center min-h-[60vh] gap-8">
  <div class="text-center">
    <h1 class="text-4xl font-extrabold text-purple-700 mb-2">
      Welcome to QuizApp!
    </h1>
    <p class="text-lg text-gray-700 dark:text-gray-200 mb-4">
      Test your knowledge and challenge yourself with fun quizzes.
    </p>
    <div
      *ngIf="previousScore"
      class="bg-green-100 text-green-800 rounded px-4 py-2 mb-4 inline-block"
    >
      Previous Score: <span class="font-bold">{{ previousScore }}</span>
    </div>
  </div>
  <a [routerLink]="'./quiz'">
    <button
      class="px-8 py-4 bg-gradient-to-r from-purple-500 to-blue-500 text-white text-2xl font-semibold rounded-lg shadow-lg hover:scale-105 transition-transform"
    >
      Start Quiz
    </button>
  </a>
</div>
