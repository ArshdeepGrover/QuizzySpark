<div class="flex flex-col items-center justify-center min-h-[40vh] space-y-4">
  <!-- Spinner -->
  <div class="relative">
    <div class="h-16 w-16 rounded-full border-4 border-gray-200"></div>
    <div
      class="absolute top-0 left-0 h-16 w-16 rounded-full border-4 border-transparent border-t-purple-500 animate-spin"
    ></div>
  </div>

  <!-- Loading Text -->
  <div class="text-center space-y-2">
    <p class="text-lg font-medium text-gray-700 dark:text-gray-300">
      Loading Questions...
    </p>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Please wait while we prepare your quiz
    </p>
  </div>

  <!-- Animated Dots -->
  <div class="flex space-x-1">
    <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></div>
    <div
      class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"
      style="animation-delay: 0.1s"
    ></div>
    <div
      class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"
      style="animation-delay: 0.2s"
    ></div>
  </div>
</div>
