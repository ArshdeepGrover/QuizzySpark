<div *ngIf="!quizFinish">
  <div class="w-full left-0 bg-gray-200 dark:bg-gray-700 fixed top-0 h-2">
    <div
      class="bg-blue-600 text-xs font-medium text-blue-100 text-center p-0.5 leading-none h-2"
      [ngStyle]="{ width: currentQuestion + 1 + '0%' }"
    ></div>
  </div>
  <div
    class="flex flex-col md:flex-row gap-8 mt-8 items-start justify-center w-full max-w-5xl mx-auto"
  >
    <!-- Left: Main Question Card -->
    <div class="flex-1 w-full md:max-w-2xl">
      <div *ngIf="currentQuestion < questions.length">
        <app-question-card
          [question]="questions[currentQuestion]"
          [questionNumber]="currentQuestion + 1"
          [totalQuestion]="questions.length"
          (showNextQuestion)="checkAndNextQuestion($event)"
        ></app-question-card>
      </div>
    </div>
    <!-- Right: Score/Progress Card -->
    <div class="w-full md:w-80 flex-shrink-0">
      <div
        class="bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-xl shadow-lg px-8 py-6 flex flex-col items-center mb-6"
      >
        <span class="text-sm uppercase tracking-widest opacity-80 mb-1"
          >Current Score</span
        >
        <span class="text-4xl font-extrabold">{{ score }}</span>
        <span class="text-xs mt-2"
          >Question {{ currentQuestion + 1 }} of {{ questions.length }}</span
        >
      </div>
      <!-- Add more widgets here if needed -->
    </div>
  </div>
</div>
