<div
  class="max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 space-y-6"
>
  <!-- Question Header -->
  <div class="text-center">
    <h2 class="text-xl font-bold text-gray-800 dark:text-white mb-2">
      Question {{ questionNumber }} of {{ totalQuestion }}
    </h2>
    <div class="w-full bg-gray-200 rounded-full h-2">
      <div
        class="bg-purple-600 h-2 rounded-full transition-all duration-300"
        [style.width.%]="(questionNumber / totalQuestion) * 100"
      ></div>
    </div>
  </div>

  <!-- Question -->
  <div class="space-y-4">
    <h3
      class="text-lg font-semibold text-gray-800 dark:text-white leading-relaxed"
    >
      {{ question.question }}
    </h3>

    <!-- Answer Options -->
    <div class="space-y-3">
      <div *ngFor="let answer of question.answers | keyvalue" class="relative">
        <input
          *ngIf="answer.value !== null"
          type="radio"
          [id]="'answer-' + answer.key"
          [name]="'question-' + question.id"
          [value]="answer.key"
          (change)="selectAnswer(question, answer.key)"
          class="sr-only"
        />
        <label
          [for]="'answer-' + answer.key"
          class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-purple-300 transition-colors"
          [ngClass]="{
            'border-green-500 bg-green-50 dark:bg-green-900/20':
              isAnswerSelected &&
              answer.key === selectedAnswerKey &&
              isAnswerCorrect,
            'border-red-500 bg-red-50 dark:bg-red-900/20':
              isAnswerSelected &&
              answer.key === selectedAnswerKey &&
              !isAnswerCorrect,
            'border-purple-500 bg-purple-50 dark:bg-purple-900/20':
              isAnswerSelected && answer.value === question.correct_answer
          }"
        >
          <div
            class="flex items-center justify-center w-6 h-6 border-2 border-gray-300 rounded-full mr-3"
            [ngClass]="{
              'border-green-500 bg-green-500':
                isAnswerSelected &&
                answer.key === selectedAnswerKey &&
                isAnswerCorrect,
              'border-red-500 bg-red-500':
                isAnswerSelected &&
                answer.key === selectedAnswerKey &&
                !isAnswerCorrect,
              'border-purple-500 bg-purple-500':
                isAnswerSelected && answer.value === question.correct_answer
            }"
          >
            <div
              *ngIf="
                isAnswerSelected &&
                answer.key === selectedAnswerKey &&
                isAnswerCorrect
              "
              class="w-2 h-2 bg-white rounded-full"
            ></div>
            <div
              *ngIf="
                isAnswerSelected &&
                answer.key === selectedAnswerKey &&
                !isAnswerCorrect
              "
              class="w-2 h-2 bg-white rounded-full"
            ></div>
            <div
              *ngIf="
                isAnswerSelected &&
                answer.value === question.correct_answer &&
                answer.key !== selectedAnswerKey
              "
              class="w-2 h-2 bg-white rounded-full"
            ></div>
          </div>
          <span class="text-gray-700 dark:text-gray-200">{{
            answer.value
          }}</span>
        </label>
      </div>
    </div>

    <!-- Feedback Message -->
    <div
      *ngIf="isAnswerSelected"
      class="p-4 rounded-lg text-center font-medium"
      [ngClass]="{
        'bg-green-100 text-green-800 dark:bg-green-900/20 dark:text-green-300':
          isAnswerCorrect,
        'bg-red-100 text-red-800 dark:bg-red-900/20 dark:text-red-300':
          !isAnswerCorrect
      }"
    >
      <div
        *ngIf="isAnswerCorrect"
        class="flex items-center justify-center gap-2"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          ></path>
        </svg>
        Correct! Well done!
      </div>
      <div
        *ngIf="!isAnswerCorrect"
        class="flex items-center justify-center gap-2"
      >
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"
          ></path>
        </svg>
        Incorrect. The correct answer is: {{ question.correct_answer }}
      </div>
    </div>
  </div>

  <!-- Navigation Button -->
  <div class="text-center pt-4">
    <button
      [disabled]="!isAnswerSelected"
      (click)="nextQuestion()"
      class="px-8 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition-transform disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 mx-auto"
    >
      {{ totalQuestion === questionNumber ? "Submit Quiz" : "Next Question" }}
      <svg
        *ngIf="totalQuestion !== questionNumber"
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 7l5 5m0 0l-5 5m5-5H6"
        ></path>
      </svg>
    </button>
  </div>
</div>
